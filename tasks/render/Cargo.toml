[package]
name = "render"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
description = "Test-only AST-to-HTML renderer and mdast-shaped signature for oxc-markdown-parser: the conformance and differential runners' side."
repository = "https://github.com/oxc-project/oxc-markdown-parser"
license = "MIT"
publish = false

# Dev task like `conformance`: prints to stdout, so it deliberately does not
# opt into the workspace's strict `print_stdout`/pedantic lints.

[lib]
path = "src/lib.rs"

[[bin]]
name = "sig-batch"
path = "src/main.rs"

[dependencies]
cow-utils = "0.1.3"
oxc-markdown-parser = { path = "../../crates/oxc_markdown_parser" }
rustc-hash = "2.1.3"
serde_json = "1"
