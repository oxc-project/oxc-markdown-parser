[package]
name = "conformance"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
description = "Conformance suite runner for oxc-markdown-parser."
repository = "https://github.com/oxc-project/oxc-markdown-parser"
license = "MIT"
publish = false

# This is a dev task that prints reports to stdout, so it deliberately does not
# opt into the workspace's strict `print_stdout`/pedantic lints.

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
cow-utils = "0.1.3"
oxc-markdown-parser = { path = "../../crates/oxc_markdown_parser" }
render = { path = "../render" }
serde_json = "1"
