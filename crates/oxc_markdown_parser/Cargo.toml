[package]
name = "oxc-markdown-parser"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
authors = []
description = "A CommonMark + GFM parser that produces a span-faithful, style-preserving typed AST."
repository = "https://github.com/oxc-project/oxc-markdown-parser"
license = "MIT"
readme = "../../README.md"
keywords = ["parser", "markdown", "commonmark"]
categories = ["parser-implementations", "text-processing"]
exclude = ["/tests"]

[lints]
workspace = true

[lib]
doctest = true

[dependencies]
oxc_allocator = ">=0.137.0"

[dev-dependencies]
insta = { version = "1.47", features = ["glob"] }

[[example]]
name = "parse"
path = "../../examples/parse.rs"
