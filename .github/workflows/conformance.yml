name: Conformance

permissions: {}

# Only parser behavior and the runner itself can change the outcome,
# so skip on CI-only, docs, or fixture edits.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "crates/oxc_markdown_parser/src/**"
      - "tasks/conformance/**"
      - "tasks/render/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/conformance.yml"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - "crates/oxc_markdown_parser/src/**"
      - "tasks/conformance/**"
      - "tasks/render/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/conformance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
      - name: Regenerate conformance snapshots
        run: cargo run -p conformance
      - name: Assert snapshots are unchanged
        run: |
          git add tasks/conformance/snapshots
          git diff --cached --exit-code -- tasks/conformance/snapshots \
            || { echo '::error::conformance snapshots are stale — run `just conformance` and commit the result'; exit 1; }
